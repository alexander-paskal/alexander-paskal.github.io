<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blog - Alexander Paskal</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Load the Zero-MD parser -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/zero-md@3?register"></script>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="projects.html">Projects</a>
        <a href="blog.html" aria-current="page">Blog</a>
        <a href="tutoring.html">Tutoring</a>
    </nav>

    <!-- Main Content Area -->
    <main id="blog-content">
        <!-- This container handles the main Blog Index List -->
        <div id="blog-index">
            <h1>Blog</h1>
            <p>Thoughts on robots, autonomy architectures, machine learning, and anything else that piques my fancy.</p>
            
            <!-- ARTICLE_LIST:START -->
            <ul class="blog-list">
                <li><a href="blog.html?post=apprenticeship_model_learning">Apprenticeship as a Model for Learning</a></li>
                <li><a href="blog.html?post=c_course_intro">C Course Intro</a></li>
            </ul>
            <!-- ARTICLE_LIST:END -->

            <div class="gallery" style="grid-template-columns: repeat(auto-fill, minmax(150px, 220px));">
                <figure>
                    <img src="assets/puppy3.jpg" alt="A vizsla puppy mid-yawn in a metal wash tub, eyes closed.">
                    <figcaption>Vizsla puppy, mid-yawn, deep in thought.</figcaption>
                </figure>
                <figure>
                    <img src="assets/puppy6.jpg" alt="A golden retriever puppy peeking over the edge of a cardboard box with its tongue out.">
                    <figcaption>Golden retriever puppy, peeking out of a box.</figcaption>
                </figure>
            </div>
        </div>

        <!-- This container displays the active article via zero-md -->
        <div id="post-view" style="display: none;">
            <p><a href="blog.html">← Back to all articles</a></p>
            <zero-md id="md-viewer">
                <template data-append>
                    <style>
                        :host {
                            --background-color: var(--bg);
                            --font-color: var(--text);
                            --link-color: var(--accent);
                            --code-bg-color: var(--bg-elev);
                            --border-color: var(--border);
                        }
                        .markdown-body {
                            background: var(--bg);
                            color: var(--text);
                        }
                    </style>
                </template>
            </zero-md>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const postName = urlParams.get('post');

        if (postName) {

            document.getElementById('blog-index').style.display = 'none';
            document.getElementById('post-view').style.display = 'block';
            const viewer = document.getElementById('md-viewer');
	    viewer.setAttribute('src', `blog/${postName}.md`);
        }
    </script>
</body>
</html>
